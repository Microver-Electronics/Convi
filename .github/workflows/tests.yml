name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Offline tests (demo tests are skipped without the KiCad demos)
        run: python -m pytest -q tests/test_offline.py